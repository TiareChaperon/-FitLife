{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitLife | Iniciar sesión</title>
    <link rel="stylesheet" href="{% static 'dashboard/estilos.css' %}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">FitLife</div>
        <div>
            <a href="/">Inicio</a>
            <a href="#login">Iniciar sesión</a>
        </div>
    </nav>

    <main class="contenedor" id="login">
        <div class="tarjeta" style="max-width: 420px; margin: 60px auto;">

            <h2>Bienvenido a FitLife</h2>
            <p>Ingresa a tu cuenta para continuar.</p>

            {% if form.errors %}
                <p style="color: #c0392b;">
                    Usuario o contraseña incorrectos.
                </p>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <p>
                    <label for="id_username">Usuario</label>
                    <input type="text"
                           name="username"
                           id="id_username"
                           required
                           autocomplete="username"
                           style="width:100%; padding:12px; margin-top:8px;">
                </p>

                <p>
                    <label for="id_password">Contraseña</label>
                    <input type="password"
                           name="password"
                           id="id_password"
                           required
                           autocomplete="current-password"
                           style="width:100%; padding:12px; margin-top:8px;">
                </p>

                <button type="submit" class="boton"
                        style="border:0; cursor:pointer; width:100%;">
                    Iniciar sesión
                </button>
            </form>

        </div>
    </main>

</body>
</html>
